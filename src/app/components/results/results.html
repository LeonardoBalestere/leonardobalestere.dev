<section class="results container" id="results">
  <div class="head">
    <h2 class="section-title"><span class="num">01</span>{{ t().results.title }}</h2>
    <p>{{ t().results.intro }}</p>
  </div>
  <div class="grid">
    @for (item of t().results.items; track item.label) {
      <article class="card card--hover item">
        <span class="value">{{ item.value }}</span>
        <span class="label">{{ item.label }}</span>
        <p>{{ item.context }}</p>
      </article>
    }
  </div>
</section>
